name: release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: build & publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build (x86_64)
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Stage assets
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-gnu/release/rusno dist/rusno-linux-x86_64
          cp install.sh dist/install.sh
          chmod +x dist/install.sh
          (cd dist && sha256sum rusno-linux-x86_64 > SHA256SUMS)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "$version" > dist/VERSION
          gh release create latest dist/* \
            --title "rusno v${version}" \
            --notes "rusno ${version}, built from $(git rev-parse --short HEAD)." \
            --target "$GITHUB_SHA"
